[package]
name = "lprs"
version = "3.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Awiteb <a@4rs.nl>"]
readme = "README.md"
description = "A local CLI vaults manager. For human and machine use"
homepage = "https://lprs.4rs.nl"
repository = "https://git.4rs.nl/awiteb/lprs.git"
rust-version = "1.74.1"
keywords = ["password", "vault", "manager", "CLI"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5.61", features = ["derive"] }
directories = "6.0.0"
log = "0.4.34"
passwords = { version = "=3.1.17", features = ["common-password"] }
pretty_env_logger = "0.5.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
inquire = "0.7.5"
bincode = "1.3.3"
rand = "0.9.5"
cbc = { version = "0.1.2", features = ["alloc", "std"] }
aes = "0.8.4"
sha2 = "0.10.9"
serde_json = "1.0.151"
base64 = "0.23.1"
clap_complete = "4.5.67"
totp-lite = "=2.0.1"
base32 = "0.5.1"
either = { version = "1.18.0", default-features = false }

[profile.release]
strip = true # Automatically strip symbols from the binary.
